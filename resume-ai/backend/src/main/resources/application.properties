server.port=8080

# Dev database (in-memory H2). For PostgreSQL, see README.
spring.datasource.url=jdbc:h2:file:./data/resumeai;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Secrets come from environment variables
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-string-at-least-32-chars}
app.jwt.expiry-hours=24
app.ai.api-key=${ANTHROPIC_API_KEY:}
app.ai.model=${AI_MODEL:claude-sonnet-5-5}
app.cors.origin=${CORS_ORIGIN:http://localhost:5173}
